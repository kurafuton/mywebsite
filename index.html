<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ランダム翻訳クイズ</title>
  <style>
    :root {
      --bg: #f5f5f5;
      --card-bg: #ffffff;
      --text: #222222;
      --answer: #0070c0;
      --btn-bg: #0070c0;
      --btn-hover: #005a9e;
      --btn-text: #ffffff;
      --hint: #888888;
      --shadow: rgba(0,0,0,0.1);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1a1a1a;
        --card-bg: #2a2a2a;
        --text: #e8e8e8;
        --answer: #4da6ff;
        --btn-bg: #005a9e;
        --btn-hover: #0070c0;
        --btn-text: #ffffff;
        --hint: #888888;
        --shadow: rgba(0,0,0,0.4);
      }
    }
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      height: 100%;
      margin: 0;
    }
    body {
      font-family: sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: var(--bg);
      color: var(--text);
      touch-action: manipulation;
    }
    #card {
      background: var(--card-bg);
      padding: 32px 24px;
      border-radius: 16px;
      box-shadow: 0 4px 20px var(--shadow);
      text-align: center;
      width: 100%;
      max-width: 420px;
    }
    #question {
      font-size: clamp(24px, 8vw, 36px);
      margin-bottom: 24px;
      word-break: break-word;
      min-height: 1.2em;
    }
    #answer {
      font-size: clamp(22px, 7vw, 32px);
      color: var(--answer);
      min-height: 1.4em;
      margin-bottom: 24px;
      word-break: break-word;
    }
    #btn {
      font-size: clamp(16px, 5vw, 18px);
      padding: 16px 24px;
      border: none;
      border-radius: 12px;
      background: var(--btn-bg);
      color: var(--btn-text);
      cursor: pointer;
      width: 100%;
      font-weight: bold;
      transition: background 0.15s;
      user-select: none;
    }
    #btn:active {
      background: var(--btn-hover);
      transform: scale(0.98);
    }
    @media (hover: hover) {
      #btn:hover {
        background: var(--btn-hover);
      }
    }
    #hint {
      margin-top: 16px;
      color: var(--hint);
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div id="card">
    <div id="question"></div>
    <div id="answer"></div>
    <button id="btn">答えを表示</button>
    <div id="hint">スペースキーでも操作できます</div>
  </div>

  <script>
    const pairs = [
      { q: '人々',       a: 'people',    dir: 'en' },
      { q: '作られる',   a: 'made',      dir: 'en' },
      { q: '信じており', a: 'believed',  dir: 'en' },
      { q: 'もう1つ',    a: 'another',   dir: 'en' },
      { q: '習得した',   a: 'learned',   dir: 'en' },
      { q: '人気',       a: 'popular',   dir: 'en' },
      { q: 'word',       a: '単語',       dir: 'ja' },
      { q: 'originally', a: '元は',       dir: 'ja' },
      { q: 'meant',      a: '意味していた', dir: 'ja' },
      { q: 'ancient',    a: '古代の',     dir: 'ja' },
      { q: 'by',         a: 'により',     dir: 'ja' },
      { q: 'country',    a: '国',         dir: 'ja' },
      { q: 'problem',    a: '問題',       dir: 'ja' },
      { q: 'sugar',      a: '砂糖',       dir: 'ja' },
      { q: 'century',    a: '世紀',       dir: 'ja' },
      { q: 'since',      a: '以来',       dir: 'ja' },
      { q: 'without',    a: 'なしで',     dir: 'ja' },
      { q: 'also',       a: 'も',         dir: 'ja' },
      { q: 'keep',       a: '保存する',   dir: 'ja' },
      { q: 'main',       a: '主な',       dir: 'ja' }
    ];

    const questionEl = document.getElementById('question');
    const answerEl   = document.getElementById('answer');
    const btn        = document.getElementById('btn');

    let remaining = [...pairs];
    let current   = null;
    let showing   = false;

    function nextQuestion() {
      if (remaining.length === 0) {
        questionEl.textContent = '🎉 全問終了！';
        answerEl.textContent = '';
        btn.textContent = '最初から';
        btn.onclick = resetQuiz;
        showing = false;
        return;
      }
      const idx = Math.floor(Math.random() * remaining.length);
      current = remaining.splice(idx, 1)[0];
      questionEl.textContent = current.q;
      answerEl.textContent = '';
      btn.textContent = '答えを表示';
      showing = false;
    }

    function showAnswer() {
      if (!current) return;
      answerEl.textContent = current.a;
      btn.textContent = '次の問題へ';
      showing = true;
    }

    function handleButton() {
      if (!current) return;
      if (showing) {
        current = null;
        nextQuestion();
      } else {
        showAnswer();
      }
    }

    function resetQuiz() {
      remaining = [...pairs];
      current = null;
      showing = false;
      btn.onclick = handleButton;
      nextQuestion();
    }

    btn.onclick = handleButton;

    document.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        btn.click();
      }
    });

    nextQuestion();
  </script>
</body>
</html>
