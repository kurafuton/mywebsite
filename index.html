<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=yes">
<title>単語練習・間違い復習</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#f5f7fb;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:16px}
.card{background:#fff;width:100%;max-width:600px;border-radius:32px;box-shadow:0 12px 30px rgba(0,0,0,.08);padding:24px 20px 32px}
h1{font-size:1.3rem;font-weight:600;color:#1e293b;text-align:center;margin-bottom:8px}
.sub{text-align:center;color:#64748b;font-size:.85rem;margin-bottom:24px;border-bottom:1px solid #e2e8f0;padding-bottom:16px}
.prompt{background:#f1f5f9;border-radius:24px;padding:32px 16px;margin-bottom:20px;text-align:center;min-height:140px;display:flex;flex-direction:column;justify-content:center;word-break:break-word}
.prompt-label{font-size:.8rem;text-transform:uppercase;letter-spacing:2px;color:#3b82f6;font-weight:600;margin-bottom:8px}
.prompt-word{font-size:2.2rem;font-weight:700;color:#0f172a;line-height:1.3}
.answer-area{background:#fff;border:2px dashed #cbd5e1;border-radius:20px;padding:20px 16px;margin-bottom:24px;text-align:center;min-height:100px;display:flex;flex-direction:column;justify-content:center}
.answer-label{font-size:.75rem;color:#64748b;letter-spacing:1px;margin-bottom:6px}
.answer-text{font-size:1.8rem;font-weight:600;color:#0f172a;word-break:break-word;line-height:1.4}
.hidden .answer-text{display:none}
.hidden .answer-text::after{content:"?";display:block;font-size:2.2rem;color:#94a3b8;font-weight:400}
.btn-group{display:flex;flex-direction:column;gap:12px}
.btn{border:none;background:#3b82f6;color:#fff;padding:18px 12px;font-size:1.2rem;font-weight:600;border-radius:60px;cursor:pointer;transition:transform .1s;box-shadow:0 4px 10px rgba(59,130,246,.3);display:flex;align-items:center;justify-content:center;gap:8px;-webkit-tap-highlight-color:transparent}
.btn:active{transform:scale(.97)}
.btn:disabled{background:#cbd5e1;box-shadow:none;color:#94a3b8;pointer-events:none}
.btn-restart,.btn-correct{background:#10b981;box-shadow:0 4px 10px rgba(16,185,129,.3)}
.btn-wrong{background:#ef4444;box-shadow:0 4px 10px rgba(239,68,68,.3)}
.choice-group{display:flex;gap:12px;margin-top:4px}
.choice-group .btn{flex:1}
.progress{text-align:center;font-size:.85rem;color:#64748b;margin-top:20px;display:flex;justify-content:space-between;align-items:center;padding:0 4px}
.badge{background:#e2e8f0;padding:6px 12px;border-radius:40px;font-weight:500;color:#334155}
.space-hint{font-size:.75rem;color:#94a3b8;background:#f8fafc;padding:4px 10px;border-radius:30px;display:inline-block}
.round-info{text-align:center;font-size:.85rem;color:#3b82f6;font-weight:600;margin-bottom:8px}
@media(max-width:420px){.card{padding:20px 16px 24px}.prompt-word{font-size:1.8rem}.answer-text{font-size:1.5rem}.btn{font-size:1rem;padding:16px 12px}}
</style>
</head>
<body>
<div class="card">
<h1>📚 単語練習・間違い復習</h1>
<div class="sub">英→日 / 日→英 ランダム</div>
<div class="round-info" id="roundInfo">1周目</div>
<div class="prompt">
<div class="prompt-label" id="promptLabel">英語</div>
<div class="prompt-word" id="promptWord">読み込み中...</div>
</div>
<div class="answer-area hidden" id="answerArea">
<div class="answer-label">答え</div>
<div class="answer-text" id="answerText"></div>
</div>
<div class="btn-group" id="btnGroup">
<button class="btn" id="actionBtn">🔍 答えを表示 <span style="font-size:.8rem;opacity:.8">(スペース)</span></button>
<div class="choice-group" id="choiceGroup" style="display:none">
<button class="btn btn-correct" id="correctBtn">⭕ 正解</button>
<button class="btn btn-wrong" id="wrongBtn">❌ 間違い</button>
</div>
</div>
<div class="progress">
<span class="badge" id="progressBadge">0 / 0</span>
<span class="space-hint">␣ スペースキーで操作</span>
</div>
</div>
<script>
(function(){
var pairs=[
["phone","電話"],
["trust","～を信用する"],
["whole","まるまるの、全体の、すべての"],
["crazy","《be crazy about ～》～に夢中である、熱中している"],
["audience","聴衆，観客"],
["police","警察，警官隊"],
["hard","熱心な、勤勉な、大変な"],
["air","空気，大気"],
["dish","《皿に盛った》料理"],
["let","《let+•+原形不定詞で》～に（自由に）…させる"],
["Let me see.","ええと、そうねえ"],
["other","もう一方、残り"],
["take","～を選ぶ、《選んで》～に決める、～を買う"],
["leave","～を置き忘れる"],
["somewhere","どこかで，どこかへ"],
["another","別のもの〔人］"],
["male","《女性に対して》男性、《動物の》雄"],
["female","《男性に対して》女性、《動物の》雌"],
["celebrate","～を祝う"],
["thank","～に感謝する、礼を言う"],
["each","それぞれ、めいめい"],
["myself","私自身"],
["himself","彼自身"],
["yourselves","あなたたち自身"],
["itself","それ自身"],
["make oneself at home","くつろぐ、楽にする"],
["say to oneself","心の中で思う"],
["take care of oneself","体に気をつける"],
["talk to oneself","独り言を言う"],
["for oneself","独力で、自分のために"],
["president","会長，社長"],
["welcome","～を歓迎する"],
["take part in","～に参加する"],
["make an effort","努力する"],
["women","《womanの複数形》女、女性"],
["professional","プロの"],
["happen","起こる、生じる"],
["moment","瞬間，ちょっとの間"],
["suffer","《困難などで》苦しむ、悩む"],
["capital","首都"],
["religion","宗教"],
["destroy","～を破壊する"],
["stupid","愚かな"],
["place","順位，地位"],
["book","《部屋・座席など》～を予約する"],
["exchange","～を両替する、交換する"],
["apply","申し込む"]
];
var all=[];
pairs.forEach(function(p){
all.push({p:p[0],a:p[1],l:'英語 → 日本語'});
all.push({p:p[1],a:p[0],l:'日本語 → 英語'});
});
function sh(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
var round=1,wrong=[],queue=[],cur=null,rem=0,tot=0,shown=false,fin=false;
var $=function(id){return document.getElementById(id)};
var pLabel=$('promptLabel'),pWord=$('promptWord'),aArea=$('answerArea'),aText=$('answerText'),
actBtn=$('actionBtn'),okBtn=$('correctBtn'),ngBtn=$('wrongBtn'),chGroup=$('choiceGroup'),
badge=$('progressBadge'),btnGroup=$('btnGroup'),rInfo=$('roundInfo');
function updProg(){badge.textContent=(tot-rem)+' / '+tot}
function updRound(){rInfo.textContent=round===1?'1周目（全単語）':round+'周目（間違い復習: '+tot+'問）'}
function start1(){round=1;wrong=[];queue=sh(all.slice());rem=queue.length;tot=all.length;updRound();load()}
function nextRound(){
if(!wrong.length){finish();return}
round++;queue=sh(wrong.slice());rem=queue.length;tot=wrong.length;wrong=[];updRound();load()
}
function finish(){
fin=true;cur=null;pLabel.textContent='完了';pWord.textContent='🎉 すべての問題を終えました';
aArea.classList.add('hidden');aText.textContent='';actBtn.disabled=true;actBtn.style.display='none';chGroup.style.display='none';
var rb=document.getElementById('restartBtn');
if(!rb){rb=document.createElement('button');rb.id='restartBtn';rb.className='btn btn-restart';
rb.innerHTML='🔄 最初から <span style="font-size:.8rem;opacity:.8">(スペース)</span>';
rb.addEventListener('click',restart);btnGroup.appendChild(rb)}
rb.style.display='flex';updProg()
}
function load(){
if(!queue.length){
if(round===1){wrong.length?nextRound():finish()}
else{wrong.length?nextRound():finish()}
return
}
cur=queue.shift();rem=queue.length;shown=false;fin=false;
pLabel.textContent=cur.l;pWord.textContent=cur.p;aArea.classList.add('hidden');aText.textContent=cur.a;
actBtn.disabled=false;actBtn.style.display='flex';
actBtn.innerHTML='🔍 答えを表示 <span style="font-size:.8rem;opacity:.8">(スペース)</span>';
chGroup.style.display='none';
var rb=document.getElementById('restartBtn');if(rb)rb.style.display='none';
updProg()
}
function show(){
if(!cur||shown||fin)return;
shown=true;aArea.classList.remove('hidden');actBtn.style.display='none';chGroup.style.display='flex'
}
function record(ok){
if(!cur||!shown||fin)return;
if(!ok&&!wrong.some(function(q){return q.p===cur.p&&q.a===cur.a}))wrong.push(cur);
if(queue.length){load()}
else{
if(round===1){wrong.length?nextRound():finish()}
else{wrong.length?nextRound():finish()}
}
}
function restart(){
var rb=document.getElementById('restartBtn');if(rb)rb.style.display='none';
actBtn.style.display='flex';actBtn.disabled=false;chGroup.style.display='none';
start1()
}
function actClick(){
if(fin){restart();return}
if(!cur){load();return}
if(!shown)show()
}
function keydown(e){
if(e.code==='Space'||e.key===' '||e.key==='Spacebar'){
e.preventDefault();
if(fin){restart();return}
if(!cur)return;
if(!shown)show();else record(true)
}
}
actBtn.addEventListener('click',actClick);
okBtn.addEventListener('click',function(){record(true)});
ngBtn.addEventListener('click',function(){record(false)});
window.addEventListener('keydown',keydown);
start1()
})();
</script>
</body>
</html>
