<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>穴埋めクイズ</title>
<style>
  :root {
    --bg: #f5f5f5;
    --card: #ffffff;
    --text: #222222;
    --sub: #666666;
    --accent: #4a90d9;
    --border: #dddddd;
    --correct: #2e9e5b;
    --wrong: #d94a4a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121212;
      --card: #1e1e1e;
      --text: #eeeeee;
      --sub: #aaaaaa;
      --accent: #6aa9e9;
      --border: #333333;
      --correct: #4cc47a;
      --wrong: #e56b6b;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 16px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 16px;
    line-height: 1.6;
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 1.2rem; margin: 0 0 12px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 16px;
  }
  .progress { font-size: 0.85rem; color: var(--sub); margin-bottom: 8px; }
  .question { font-size: 1.05rem; margin-bottom: 12px; }
  .question .blank { color: var(--accent); font-weight: bold; }
  .answer {
    font-size: 1rem;
    margin: 12px 0;
    padding: 10px;
    background: var(--bg);
    border-radius: 8px;
    border: 1px dashed var(--border);
    min-height: 1.6em;
  }
  .answer.hidden { display: none; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; }
  button {
    flex: 1;
    min-width: 100px;
    padding: 12px;
    font-size: 1rem;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    background: var(--accent);
    color: #fff;
  }
  button.ghost {
    background: transparent;
    color: var(--text);
    border: 1px solid var(--border);
  }
  button:disabled { opacity: 0.4; cursor: default; }
  .result { font-weight: bold; margin-top: 10px; }
  .result.correct { color: var(--correct); }
  .result.wrong { color: var(--wrong); }
  .done { text-align: center; }
  .done button { flex: none; }
</style>
</head>
<body>
<div class="wrap">
  <h1>穴埋めクイズ</h1>
  <div id="app"></div>
</div>
<script>
const data = [
  {
    q: "I need a new phone because I lost () () ().",
    jp: "私には新しい電話が必要です、なぜなら私の古いものをなくしたからです。",
    a: "my old one"
  },
  {
    q: "When I took my dog for a walk yesterday, () () ().",
    jp: "昨日、私が犬を散歩に連れて行った時、何も変わったことは起こりませんでした。",
    a: "nothing strange happened"
  },
  {
    q: "We are looking for a good restaurant () () () () ().",
    jp: "私たちは友人にすすめられる良いレストランを探しています。",
    a: "to recommend to our friends"
  },
  {
    q: "We got up early to see the () sun on New Year's Day.",
    jp: "私たちは元日に日の出を見るために早起きしました。",
    a: "rising"
  },
  {
    q: "Wash these lettuce leaves () () (), please.",
    jp: "このレタスの葉を流水で洗ってください。",
    a: "in running water"
  },
  {
    q: "Which would you like for breakfast, a () () or () eggs?",
    jp: "朝食にはゆで卵とスクランブルエッグのどちらになさいますか。",
    a: "boiled egg / scrambled"
  },
  {
    q: "Can you see the two girls there? The girl () () () () is Lisa.",
    jp: "そこにいる二人の女の子が見えますか。左に座っている女の子がリサです。",
    a: "sitting on the left"
  },
  {
    q: "I love the meals () () () ().",
    jp: "私は学校で出される食事が大好きです",
    a: "served in our school"
  },
  {
    q: "Can everybody see the figure () () () ()?",
    jp: "皆さんは黒板に描かれた図が見えますか。",
    a: "drawn on the blackboard"
  }
];

let queue = [];
let index = 0;
let status = {};

const app = document.getElementById('app');

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function start() {
  status = {};
  data.forEach((_, i) => { status[i] = null; });
  queue = shuffle(data.map((_, i) => i));
  index = 0;
  render();
}

function startRound2() {
  const wrong = Object.keys(status).filter(k => status[k] === 'wrong');
  if (wrong.length === 0) {
    renderDone(true);
    return;
  }
  queue = shuffle(wrong.map(Number));
  index = 0;
  render();
}

function render() {
  if (index >= queue.length) {
    renderDone(false);
    return;
  }
  const id = queue[index];
  const item = data[id];
  app.innerHTML = `
    <div class="card">
      <div class="progress">問題 ${index + 1} / ${queue.length}</div>
      <div class="question">${item.q.replace(/\(\)/g, '<span class="blank">(　)</span>')}</div>
      <div class="question" style="color:var(--sub);font-size:0.9rem;">${item.jp}</div>
      <div id="answer" class="answer hidden"></div>
      <div id="result" class="result"></div>
      <div class="actions" id="actions">
        <button id="showBtn">答えを見る</button>
      </div>
    </div>
  `;
  document.getElementById('showBtn').onclick = () => {
    const ans = document.getElementById('answer');
    ans.textContent = item.a;
    ans.classList.remove('hidden');
    const actions = document.getElementById('actions');
    actions.innerHTML = `
      <button id="okBtn" style="background:var(--correct);">正解</button>
      <button id="ngBtn" style="background:var(--wrong);">不正解</button>
    `;
    document.getElementById('okBtn').onclick = () => judge(id, 'correct');
    document.getElementById('ngBtn').onclick = () => judge(id, 'wrong');
  };
}

function judge(id, verdict) {
  status[id] = verdict;
  const res = document.getElementById('result');
  if (verdict === 'correct') {
    res.textContent = '正解として記録しました';
    res.className = 'result correct';
  } else {
    res.textContent = '不正解として記録しました';
    res.className = 'result wrong';
  }
  document.getElementById('okBtn').disabled = true;
  document.getElementById('ngBtn').disabled = true;
  setTimeout(() => {
    index++;
    render();
  }, 500);
}

function renderDone(perfect) {
  const wrongCount = Object.keys(status).filter(k => status[k] === 'wrong').length;
  const correctCount = Object.keys(status).filter(k => status[k] === 'correct').length;
  let msg = '';
  if (perfect || wrongCount === 0) {
    msg = '<p>全問正解です！お疲れさまでした。</p>';
  } else {
    msg = `<p>1回目の結果：正解 ${correctCount} 問 / 不正解 ${wrongCount} 問</p>
           <p>2回目は間違えた問題だけを出題します。</p>`;
  }
  app.innerHTML = `
    <div class="card done">
      ${msg}
      <div class="actions" style="justify-content:center;margin-top:12px;">
        ${wrongCount > 0 && !perfect ? '<button id="r2">2回目を始める</button>' : ''}
        <button id="reset" class="ghost">最初から</button>
      </div>
    </div>
  `;
  const r2 = document.getElementById('r2');
  if (r2) r2.onclick = startRound2;
  document.getElementById('reset').onclick = start;
}

start();
</script>
</body>
</html>
